<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PHANTASMA // Segunda chance</title>
<style>
:root{--g:#69ff96;--r:#ff4058;--c:#31e6ff;--fg:#ecfff2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:var(--fg);font-family:"Courier New",monospace}
body{
  min-height:100dvh;display:grid;place-items:center;padding:18px;overflow:hidden;
  background:radial-gradient(circle at 50% 30%,rgba(36,110,61,.10),transparent 38%),#000
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0 1px,transparent 2px 4px);
  opacity:.4
}
.card{
  width:min(760px,100%);padding:clamp(28px,6vw,62px);
  border:1px solid rgba(105,255,150,.24);
  background:rgba(0,5,2,.72);position:relative;z-index:2;
  box-shadow:0 0 55px rgba(105,255,150,.06)
}
.tag{font-size:11px;letter-spacing:.18em;color:var(--r);text-transform:uppercase}
h1{
  font-size:clamp(38px,9vw,78px);line-height:.95;margin:20px 0;
  text-shadow:2px 0 var(--r),-2px 0 var(--c)
}
p{line-height:1.8;color:rgba(236,255,242,.76)}
.phantasma{font-size:clamp(17px,3vw,22px);color:var(--fg);margin:28px 0}
button{
  width:100%;margin-top:18px;border:1px solid var(--g);background:transparent;color:var(--g);
  padding:15px 20px;font:inherit;letter-spacing:.08em;text-transform:uppercase;cursor:pointer
}
button:hover{background:var(--g);color:#001407}
.small{font-size:11px;color:#77827b;margin-top:16px}
.glitch{animation:gl 3.2s infinite}
@keyframes gl{0%,92%,100%{transform:none}93%{transform:translateX(4px)}94%{transform:translateX(-3px)}}
</style>
</head>
<body>
<section class="card">
  <div class="tag">resposta incorreta // falha registrada</div>
  <h1 class="glitch">ESPERAVA MAIS.</h1>
  <p class="phantasma">Sério. Eu tinha expectativas. Não muitas. Mas tinha.</p>
  <p>Você falhou na charada.</p>
  <p>Então vou simplificar as coisas para você.</p>
  <p class="phantasma">Uma segunda chance. Tente não desperdiçá-la.</p>

  <button id="go">INICIAR SEGUNDA CHANCE</button>
  <div class="small">Redirecionando para o teste...</div>
</section>

<script>
const GAME_URL = "jogo/?origem=erro";

function irParaOJogo(){
  window.location.href = GAME_URL;
}

document.getElementById("go").addEventListener("click", irParaOJogo);
</script>
</body>
</html>
