<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso negado</title><style>
:root{--g:#6dff98;--r:#ff3e58;--c:#31e6ff;--fg:#e9fff0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:var(--fg);font-family:"Courier New",monospace}
body{min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.8)),url("phantasma-bg.jpg") center/cover no-repeat fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.03) 0 1px,transparent 2px 4px);opacity:.45;animation:scan .16s steps(2) infinite}
body:after{content:"";position:fixed;inset:-5%;pointer-events:none;z-index:49;background:linear-gradient(90deg,transparent 48%,rgba(49,230,255,.04) 49%,transparent 50%);animation:drift 1.3s steps(2) infinite}
@keyframes scan{50%{transform:translateY(1px)}}@keyframes drift{20%{transform:translateX(-2%)}21%{transform:translateX(2%)}53%{transform:translateX(-1%)}}
.wrap{width:min(800px,100%);position:relative;z-index:2}.card{position:relative;overflow:hidden;border:1px solid rgba(109,255,152,.22);padding:clamp(28px,6vw,62px);background:rgba(0,5,2,.68);box-shadow:0 0 70px rgba(32,255,113,.08);backdrop-filter:blur(4px);animation:flick 5s infinite}
.card:before,.card:after{content:"";position:absolute;left:-5%;width:110%;height:12px;pointer-events:none;opacity:0}.card:before{top:27%;background:rgba(49,230,255,.16);animation:tear 4s infinite}.card:after{top:68%;background:rgba(255,62,88,.12);animation:tear 5.3s infinite reverse}
@keyframes flick{0%,92%,95%,100%{opacity:1}93%{opacity:.72;filter:contrast(1.6)}94%{transform:translateX(2px)}}@keyframes tear{0%,88%,100%{opacity:0;transform:none}89%{opacity:.65;transform:translateX(18px)}90%{opacity:.2;transform:translateX(-18px)}}
.tag{color:var(--g);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:18px}h1{font-size:clamp(34px,8vw,72px);line-height:.95;margin:0 0 24px;letter-spacing:.06em;text-shadow:2px 0 var(--r),-2px 0 var(--c)}p{line-height:1.8;color:rgba(233,255,240,.72)}
.quote{font-size:clamp(18px,3vw,24px);border-left:2px solid var(--g);padding-left:20px;margin:28px 0}.glitch{animation:glitch 2.8s infinite}@keyframes glitch{0%,88%,100%{transform:none}89%{transform:translate(4px,-1px)}90%{transform:translate(-3px,1px)}}
.signal{font-size:11px;letter-spacing:.12em;color:rgba(109,255,152,.52)}.unstable{color:var(--r);animation:blink .65s steps(1) infinite}@keyframes blink{50%{opacity:.2}}
button,a.btn{display:inline-block;margin-top:18px;border:1px solid var(--g);background:#0008;color:var(--g);padding:14px 20px;font:inherit;text-transform:uppercase;letter-spacing:.1em;text-decoration:none;cursor:pointer}button:hover,a.btn:hover{background:var(--g);color:#001306}
input{width:100%;padding:15px 16px;margin-top:16px;background:#000d;border:1px solid rgba(109,255,152,.35);color:var(--fg);font:inherit;outline:none}.small{font-size:12px;color:#7d8d82;margin-top:18px}.center{text-align:center}.red{color:var(--r)}.green{color:var(--g)}
@media(max-width:560px){body{padding:12px}.card{padding:28px 20px}}
.blackout{position:fixed;inset:0;background:#000;z-index:999;display:none;place-items:center;padding:24px}.blackout.show{display:grid}.offline{color:#888;font-family:Arial,sans-serif}.collapse{animation:collapse .8s steps(5) forwards}@keyframes collapse{25%{transform:translateX(14px) skewX(5deg)}50%{transform:translateX(-22px) scaleY(.9)}75%{transform:translateX(30px) scaleY(.25)}100%{transform:scaleY(0);opacity:0}}
/* ===== MOBILE FIX V4 ===== */
html{
  min-height:100%;
  background:#000;
  -webkit-text-size-adjust:100%;
}
body{
  min-height:100svh;
  min-height:100dvh;
  height:auto;
  overflow-x:hidden;
  overflow-y:auto;
  align-items:start;
  justify-items:center;
  padding:
    max(16px, env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    max(24px, env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));
  background-attachment:scroll;
}
.wrap{
  width:min(800px,100%);
  margin:clamp(18px,5vh,56px) auto;
}
.card{
  width:100%;
}
input,button,a.btn{
  font-size:16px; /* evita zoom automático do iOS */
}
input{
  scroll-margin-top:18vh;
  scroll-margin-bottom:35vh;
}
@media (max-width:560px){
  body{
    display:block;
    min-height:100dvh;
    padding-top:max(14px, env(safe-area-inset-top));
    padding-bottom:max(40px, env(safe-area-inset-bottom));
  }
  .wrap{
    margin:14px auto 40px;
    width:100%;
  }
  .card{
    padding:24px 18px 28px;
    min-height:auto;
    backdrop-filter:blur(2px);
  }
  h1{
    font-size:clamp(34px,13vw,58px);
    word-break:normal;
    overflow-wrap:anywhere;
  }
  .quote{
    font-size:clamp(16px,5vw,20px);
    line-height:1.55;
    margin:20px 0;
    padding-left:14px;
  }
  p{
    line-height:1.6;
  }
  form{
    width:100%;
  }
  input{
    width:100%;
    min-height:52px;
  }
  button,a.btn{
    width:100%;
    text-align:center;
    min-height:50px;
  }
  .signal{
    line-height:1.6;
    overflow-wrap:anywhere;
  }
}
/* Quando o teclado virtual reduz a viewport */
@media (max-height:560px){
  body{
    display:block;
  }
  .wrap{
    margin:8px auto 28px;
  }
  .card{
    padding-top:18px;
    padding-bottom:22px;
  }
  h1{
    font-size:34px;
    margin-bottom:14px;
  }
  .quote{
    margin:14px 0;
    font-size:16px;
  }
}
</style></head><body>
<main class="wrap" id="erro"><section class="card"><div class="tag red">Acesso negado</div><h1 class="glitch">QUASE.</h1><div class="quote" id="piada"></div><p class="red">&gt; tentativa registrada.</p><p class="small">Encerrando conexão...</p></section></main>
<div class="blackout" id="blackout"><div class="offline"><h2>Não foi possível acessar este site</h2><p>A conexão foi encerrada inesperadamente.</p><p>ERR_CONNECTION_CLOSED</p></div></div>
<script>const p=["“Admirável confiança. Pena que veio sem a resposta certa.”","“Os Cisnes teriam vergonha dessa tentativa.”","“Curiosidade: dez. Resposta: zero.”","“Você chegou tão longe para errar justo agora?”"];piada.textContent=p[Math.floor(Math.random()*p.length)];setTimeout(()=>erro.classList.add("collapse"),3600);setTimeout(()=>{erro.style.display="none";blackout.classList.add("show");document.title="Site indisponível";sessionStorage.clear()},4350)</script></body></html>
