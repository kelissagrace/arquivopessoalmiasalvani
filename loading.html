<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PHANTASMA // Arquivo restrito</title>

<style>
:root{
  --g:#69ff96;
  --r:#ff4058;
  --c:#31e6ff;
  --fg:#ecfff2;
  --dim:#7c8d83;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#000;
  color:var(--fg);
  font-family:"Courier New",monospace;
  -webkit-text-size-adjust:100%;
}

body{
  min-height:100svh;
  min-height:100dvh;
  overflow-x:hidden;
  display:grid;
  place-items:center;
  padding:
    max(14px,env(safe-area-inset-top))
    max(12px,env(safe-area-inset-right))
    max(20px,env(safe-area-inset-bottom))
    max(12px,env(safe-area-inset-left));
  background:
    linear-gradient(rgba(0,0,0,.70),rgba(0,0,0,.88)),
    url("phantasma-bg.jpg") center/cover no-repeat fixed;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:1000;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.028) 0 1px,
      transparent 2px 5px
    );
  opacity:.55;
}

#matrix{
  position:fixed;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
  opacity:.42;
  transition:opacity .35s ease, filter .35s ease;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.08),rgba(0,0,0,.28));
}

.matrix-col{
  position:absolute;
  top:-130%;
  color:rgba(105,255,150,.62);
  font-size:13px;
  line-height:1.05;
  writing-mode:vertical-rl;
  text-orientation:upright;
  white-space:pre;
  animation:fall linear infinite;
  text-shadow:1px 0 rgba(49,230,255,.18);
}

@keyframes fall{
  from{transform:translateY(-10%)}
  to{transform:translateY(250%)}
}

body.matrix-hot #matrix{
  opacity:.72;
  filter:contrast(1.35) brightness(1.15);
}

body.matrix-danger #matrix .matrix-col{
  color:rgba(255,64,88,.58);
  text-shadow:
    1px 0 rgba(255,64,88,.42),
    -1px 0 rgba(49,230,255,.20);
}

body.matrix-hot #matrix .matrix-col{
  animation-duration:1.25s !important;
}

.stage{
  position:relative;
  z-index:3;
  width:min(850px,100%);
  min-height:min(620px,78dvh);
  display:grid;
  place-items:center;
}

.screen{
  width:100%;
  display:none;
  place-items:center;
  text-align:center;
}

.screen.show{
  display:grid;
  animation:boot .48s steps(2) both;
}

@keyframes boot{
  0%{opacity:0;transform:scale(.985);filter:blur(5px) contrast(1.8)}
  30%{opacity:.4;transform:translateX(5px)}
  55%{opacity:.8;transform:translateX(-4px)}
  100%{opacity:1;transform:none;filter:none}
}

/* ===== BARRA ===== */
.loader-wrap{
  width:min(650px,88vw);
}

.loader-label{
  color:rgba(105,255,150,.70);
  font-size:11px;
  letter-spacing:.14em;
  margin-bottom:14px;
}

.loader-track{
  position:relative;
  height:4px;
  width:100%;
  background:rgba(105,255,150,.10);
  overflow:hidden;
  box-shadow:0 0 0 1px rgba(105,255,150,.16);
}

.loader-bar{
  width:0%;
  height:100%;
  background:var(--g);
  box-shadow:0 0 15px rgba(105,255,150,.45);
  transition:width .12s linear;
}

.loader-percent{
  margin-top:12px;
  color:#6f8176;
  font-size:10px;
  letter-spacing:.12em;
}

/* ===== CADEADO ===== */
.lock-wrap{
  width:min(620px,92vw);
  display:grid;
  place-items:center;
  gap:20px;
}

.lock{
  position:relative;
  width:118px;
  height:110px;
  filter:drop-shadow(0 0 18px rgba(105,255,150,.12));
}

.lock-body{
  position:absolute;
  left:15px;
  right:15px;
  bottom:0;
  height:68px;
  border:3px solid var(--g);
  background:rgba(1,8,4,.95);
  box-shadow:
    inset 0 0 25px rgba(105,255,150,.06),
    0 0 20px rgba(105,255,150,.08);
}

.lock-hole{
  position:absolute;
  left:50%;
  top:22px;
  width:12px;
  height:24px;
  transform:translateX(-50%);
  background:var(--g);
  clip-path:polygon(50% 0,100% 40%,72% 58%,72% 100%,28% 100%,28% 58%,0 40%);
}

.shackle{
  position:absolute;
  left:30px;
  top:0;
  width:58px;
  height:58px;
  border:7px solid var(--g);
  border-bottom:0;
  border-radius:34px 34px 0 0;
  transform-origin:11px 48px;
  transition:
    transform .65s cubic-bezier(.2,.8,.2,1),
    border-color .25s linear;
}

.lock.unlocked .shackle{
  transform:translate(6px,-5px) rotate(-36deg);
}

.lock.pending-denied{
  filter:drop-shadow(0 0 22px rgba(255,64,88,.26));
}

.lock.pending-denied .lock-body,
.lock.pending-denied .shackle{
  border-color:var(--r);
  box-shadow:
    inset 0 0 25px rgba(255,64,88,.06),
    0 0 20px rgba(255,64,88,.10);
}

.lock.pending-denied .lock-hole{
  background:var(--r);
}

.lock.denied{
  animation:deniedShake .13s steps(2) 7;
  filter:drop-shadow(0 0 25px rgba(255,64,88,.32));
}

.lock.denied .lock-body,
.lock.denied .shackle{
  border-color:var(--r);
}

.lock.denied .lock-hole{
  background:var(--r);
}

@keyframes deniedShake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(8px)}
  50%{transform:translateX(-7px)}
  75%{transform:translateX(4px)}
}

.lock-status{
  min-height:1.4em;
  color:var(--g);
  font-size:clamp(20px,5vw,34px);
  font-weight:700;
  letter-spacing:.10em;
  text-shadow:2px 0 var(--r),-2px 0 var(--c);
}

.lock-status.denied{
  color:var(--r);
}

.micro{
  color:#617168;
  font-size:10px;
  letter-spacing:.10em;
}

/* ===== AGUARDE ===== */
.wait-word{
  color:var(--fg);
  font-size:clamp(46px,12vw,110px);
  font-weight:700;
  letter-spacing:.10em;
  text-shadow:
    5px 0 var(--r),
    -5px 0 var(--c);
  opacity:0;
}

.wait-word.blink{
  animation:waitBlink .62s steps(2) 3;
}

#breachScreen .wait-word{
  font-size:clamp(24px,6vw,54px);
  color:var(--r);
  opacity:1;
  animation:breachPulse .18s steps(2) infinite;
}

@keyframes breachPulse{
  0%,60%,100%{
    transform:none;
    text-shadow:5px 0 var(--r),-5px 0 var(--c);
  }
  62%{
    transform:translateX(8px);
    text-shadow:9px 0 var(--r),-8px 0 var(--c);
  }
  78%{transform:translateX(-7px)}
}

@keyframes waitBlink{
  0%,35%{opacity:0;transform:scale(.96)}
  36%,78%{opacity:1;transform:scale(1)}
  79%,100%{opacity:0;transform:scale(1.02)}
}

/* ===== CORRETO / INVASÃO ===== */
.takeover{
  width:min(760px,94vw);
  border:1px solid rgba(105,255,150,.22);
  background:rgba(0,5,2,.79);
  padding:clamp(24px,6vw,56px);
  text-align:left;
  overflow:hidden;
  position:relative;
}

.takeover::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  background:
    linear-gradient(90deg,
      transparent 0 17%,
      rgba(49,230,255,.20) 18% 20%,
      transparent 21% 46%,
      rgba(255,64,88,.18) 47% 50%,
      transparent 51%);
}

#takeoverScreen.invasion .takeover{
  animation:
    takeoverCrash .92s steps(2) both,
    takeoverFlicker 4.2s 1s infinite;
}

#takeoverScreen.invasion .takeover::before{
  animation:takeoverTear .62s steps(2) 4;
}

#takeoverScreen.invasion .takeover-tag{
  animation:takeoverTag .42s steps(2) 3;
}

#takeoverScreen.invasion h1{
  animation:
    takeoverTitleIn 1.05s steps(2) both,
    titleCorrupt .22s steps(2) 9 1.05s;
}

#takeoverScreen.invasion p{
  animation:copyRecover .72s ease both;
}

#takeoverScreen.invasion p:nth-of-type(1){animation-delay:.72s}
#takeoverScreen.invasion p:nth-of-type(2){animation-delay:.88s}
#takeoverScreen.invasion p:nth-of-type(3){animation-delay:1.02s}
#takeoverScreen.invasion .action{animation:copyRecover .72s ease 1.15s both}

@keyframes takeoverCrash{
  0%{opacity:0;transform:scale(1.04) translateX(14px);filter:blur(8px) contrast(2.2)}
  20%{opacity:.28;transform:scale(1.025) translateX(-12px)}
  38%{opacity:.66;transform:translateX(9px);filter:blur(3px) contrast(1.8)}
  56%{opacity:.88;transform:translateX(-7px)}
  72%{opacity:.96;transform:translateX(4px)}
  100%{opacity:1;transform:none;filter:none}
}

@keyframes takeoverTear{
  0%,40%,100%{opacity:0;transform:none}
  42%{opacity:1;transform:translateX(8%) skewX(-7deg)}
  58%{opacity:.5;transform:translateX(-7%) skewX(5deg)}
  70%{opacity:0}
}

@keyframes takeoverTitleIn{
  0%{
    opacity:0;
    transform:translateX(-22px);
    clip-path:inset(0 0 88% 0);
    text-shadow:10px 0 var(--r),-10px 0 var(--c);
  }
  28%{
    opacity:.45;
    transform:translateX(14px);
    clip-path:inset(42% 0 22% 0);
  }
  48%{
    opacity:.75;
    transform:translateX(-9px);
    clip-path:inset(12% 0 55% 0);
  }
  68%{
    opacity:.92;
    transform:translateX(5px);
    clip-path:inset(0 0 0 0);
  }
  100%{
    opacity:1;
    transform:none;
    clip-path:inset(0);
  }
}

@keyframes takeoverTag{
  0%,100%{opacity:1}
  35%{opacity:.1;transform:translateX(4px)}
  70%{opacity:.65;transform:translateX(-3px)}
}

@keyframes takeoverFlicker{
  0%,91%,94%,100%{filter:none}
  92%{filter:contrast(1.65) brightness(1.15)}
  93%{transform:translateX(1px)}
}

@keyframes copyRecover{
  from{opacity:0;transform:translateY(7px);filter:blur(2px)}
  to{opacity:1;transform:none;filter:none}
}

.takeover-tag{
  color:var(--r);
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
}

.takeover h1{
  margin:18px 0 22px;
  font-size:clamp(35px,8vw,78px);
  line-height:.95;
  color:var(--fg);
  text-shadow:
    4px 0 var(--r),
    -4px 0 var(--c);
  animation:titleCorrupt .22s steps(2) 7;
  overflow-wrap:anywhere;
}

.takeover p{
  color:rgba(236,255,242,.78);
  line-height:1.65;
  margin:11px 0;
}

.takeover .big{
  font-size:clamp(17px,3vw,23px);
  color:var(--fg);
}

.action{
  width:100%;
  min-height:50px;
  margin-top:20px;
  border:1px solid var(--g);
  background:#000;
  color:var(--g);
  padding:13px 16px;
  font:inherit;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
}

.action:hover,
.action:focus-visible{
  background:var(--g);
  color:#001407;
}

@keyframes titleCorrupt{
  0%,62%,100%{transform:none}
  64%{transform:translateX(7px)}
  72%{transform:translateX(-6px)}
  81%{transform:translateY(-2px)}
}

.glitch-flash{
  position:fixed;
  inset:0;
  z-index:50;
  pointer-events:none;
  opacity:0;
  background:
    linear-gradient(90deg,rgba(49,230,255,.10),transparent 30%,rgba(255,64,88,.12));
}

.glitch-flash.go{
  animation:flash .15s steps(2) 5;
}

@keyframes flash{
  0%,100%{opacity:0}
  50%{opacity:1}
}

@media(max-width:560px){
  body{
    background:
      linear-gradient(rgba(0,0,0,.73),rgba(0,0,0,.90)),
      url("phantasma-bg.jpg") center/cover no-repeat;
  }

  .stage{
    min-height:calc(100dvh - 42px);
  }

  .takeover{
    width:100%;
    padding:24px 18px;
  }

  .takeover h1{
    font-size:clamp(33px,12vw,58px);
  }

  .takeover p{
    font-size:14px;
  }

  .lock{
    transform:scale(.92);
  }
}

@media(max-height:560px) and (orientation:landscape){
  body{
    display:block;
    overflow-y:auto;
  }

  .stage{
    min-height:520px;
    margin:auto;
  }

  .takeover{
    margin:14px auto;
  }
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
}
</style>
</head>

<body>
<div id="matrix"></div>
<div class="glitch-flash" id="glitchFlash"></div>

<main class="stage">

  <section class="screen show" id="loadScreen">
    <div class="loader-wrap">
      <div class="loader-label">&gt; PROCESSANDO RESPOSTA...</div>
      <div class="loader-track">
        <div class="loader-bar" id="loaderBar"></div>
      </div>
      <div class="loader-percent" id="loaderPercent">0%</div>
    </div>
  </section>

  <section class="screen" id="lockScreen">
    <div class="lock-wrap">
      <div class="lock" id="lock">
        <div class="shackle"></div>
        <div class="lock-body">
          <div class="lock-hole"></div>
        </div>
      </div>
      <div class="lock-status" id="lockStatus">ARQUIVO BLOQUEADO</div>
      <div class="micro" id="lockMicro">CHAVE DE ACESSO // AGUARDANDO</div>
    </div>
  </section>

  <section class="screen" id="waitScreen">
    <div class="wait-word" id="waitWord">AGUARDE</div>
  </section>

  <section class="screen" id="breachScreen">
    <div class="wait-word" id="breachWord">&gt; CONTROLE TRANSFERIDO</div>
  </section>

  <section class="screen" id="takeoverScreen">
    <div class="takeover">
      <div class="takeover-tag">controle da sessão alterado</div>
      <h1>VOCÊ ACHOU QUE SERIA FÁCIL ASSIM?</h1>
      <p class="big">Que adorável.</p>
      <p>Você resolveu uma charada e já estava esperando sua recompensa.</p>
      <p><strong>Então você ainda não me conhece.</strong></p>
      <button class="action" id="gameBtn">INICIAR TESTE DE LEALDADE</button>
    </div>
  </section>

</main>

<script src="phantasma-audio.js"></script>
<script>
"use strict";

/*
  ============================================================
  TEMPOS — LOADING / CADEADO
  4000 = 4 segundo
  ============================================================
*/
const TIMING = {
  carregamento: 5000,
  cadeadoFechado: 800,
  desbloqueio: 3100,
  negadoNaTela: 3350,
  depoisDoAguarde: 1000
};

const result = sessionStorage.getItem("phantasma_resultado");

if(result!=="ok" && result!=="erro"){
  location.replace("charada.html");
}

const loadScreen = document.getElementById("loadScreen");
const lockScreen = document.getElementById("lockScreen");
const waitScreen = document.getElementById("waitScreen");
const breachScreen = document.getElementById("breachScreen");
const takeoverScreen = document.getElementById("takeoverScreen");

const loaderBar = document.getElementById("loaderBar");
const loaderPercent = document.getElementById("loaderPercent");

const lock = document.getElementById("lock");
const lockStatus = document.getElementById("lockStatus");
const lockMicro = document.getElementById("lockMicro");

const waitWord = document.getElementById("waitWord");
const breachWord = document.getElementById("breachWord");
const glitchFlash = document.getElementById("glitchFlash");

const gameBtn = document.getElementById("gameBtn");

/* ===== fundo hacker leve ===== */
const matrix = document.getElementById("matrix");
const glyphs = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&*<>/[]{}";

function buildMatrix(){
  matrix.innerHTML = "";

  const count = innerWidth < 560 ? 16 : 30;

  for(let i=0;i<count;i++){
    const col = document.createElement("div");
    col.className = "matrix-col";
    col.style.left = `${(i/(count-1))*100}%`;
    col.style.animationDuration = `${2.4 + Math.random()*3.4}s`;
    col.style.animationDelay = `${-Math.random()*6}s`;

    let str = "";
    const len = innerWidth < 560 ? 22 : 34;

    for(let j=0;j<len;j++){
      str += glyphs[(Math.random()*glyphs.length)|0];
    }

    col.textContent = str;
    matrix.appendChild(col);
  }
}

buildMatrix();
addEventListener("resize",buildMatrix,{passive:true});

function sound(name,volume=.35){
  if(window.PhantasmaAudio){
    PhantasmaAudio.play(name,volume);
  }
}

function showOnly(screen){
  [loadScreen,lockScreen,waitScreen,breachScreen,takeoverScreen]
    .forEach(s=>s.classList.toggle("show",s===screen));
}

function glitch(){
  glitchFlash.classList.remove("go");
  void glitchFlash.offsetWidth;
  glitchFlash.classList.add("go");
  sound("glitch",.30);
}

/* ===== barra ===== */
const start = performance.now();

function animateLoader(now){
  const elapsed = now-start;
  const progress = Math.min(1,elapsed/TIMING.carregamento);

  /* curva suave: acelera e desacelera */
  const eased = 1-Math.pow(1-progress,3);
  const pct = Math.round(eased*100);

  loaderBar.style.width = pct+"%";
  loaderPercent.textContent = pct+"%";

  if(progress<1){
    requestAnimationFrame(animateLoader);
  }else{
    setTimeout(showLock,TIMING.cadeadoFechado);
  }
}

requestAnimationFrame(animateLoader);

function showLock(){
  showOnly(lockScreen);

  lock.classList.remove("unlocked","denied","pending-denied");
  lockStatus.classList.remove("denied");

  if(result==="erro"){
    lock.classList.add("pending-denied");
    lockStatus.classList.add("denied");
    lockStatus.textContent = "ARQUIVO BLOQUEADO";
    lockMicro.textContent = "CHAVE RECUSADA // ACESSO RESTRITO";
    document.body.classList.add("matrix-danger");
  }else{
    lockStatus.textContent = "ARQUIVO BLOQUEADO";
    lockMicro.textContent = "CHAVE DE ACESSO // VERIFICANDO";
  }

  sound("click",.18);

  setTimeout(()=>{
    if(result==="ok"){
      grantAccess();
    }else{
      denyAccess();
    }
  },550);
}

/* ===== resposta correta ===== */
function grantAccess(){
  lock.classList.add("unlocked");
  lockStatus.textContent = "ACESSO CONCEDIDO";
  lockMicro.textContent = "CHAVE ACEITA // BLOQUEIO REMOVIDO";
  sound("acesso",.40);

  setTimeout(()=>{
    document.body.classList.add("matrix-hot");
    glitch();

    showOnly(breachScreen);
    breachWord.textContent = "> CONTROLE TRANSFERIDO // PHANTASMA";
    sound("glitch",.34);

    setTimeout(()=>{
      glitch();
      showOnly(takeoverScreen);
      takeoverScreen.classList.remove("invasion");
      void takeoverScreen.offsetWidth;
      takeoverScreen.classList.add("invasion");

      setTimeout(()=>{
        document.body.classList.remove("matrix-hot");
      },1700);
    },1050);

  },TIMING.desbloqueio);
}

/* ===== resposta incorreta ===== */
function denyAccess(){
  lock.classList.remove("pending-denied");
  lock.classList.add("denied");
  document.body.classList.add("matrix-danger");
  lockStatus.classList.add("denied");
  lockStatus.textContent = "ACESSO NEGADO";
  lockMicro.textContent = "CHAVE RECUSADA // PERMISSÃO REVOGADA";
  sound("erro",.45);

  setTimeout(()=>{
    showOnly(waitScreen);
    waitWord.classList.add("blink");

    /* 3 flashes de .62s */
    setTimeout(()=>{
      waitWord.classList.remove("blink");

      setTimeout(()=>{
        document.body.classList.remove("matrix-danger");
        location.replace("erro.html");
      },TIMING.depoisDoAguarde);

    },1860);

  },TIMING.negadoNaTela);
}

/* ===== correto segue para o jogo ===== */
gameBtn.addEventListener("click",()=>{
  sound("glitch",.26);
  location.href="jogo/?origem=acerto";
});
</script>
</body>
</html>
