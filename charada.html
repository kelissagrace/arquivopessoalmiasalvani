<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arquivo restrito</title><style>
:root{--g:#6dff98;--r:#ff3e58;--c:#31e6ff;--fg:#e9fff0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:var(--fg);font-family:"Courier New",monospace}
body{min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.8)),url("phantasma-bg.jpg") center/cover no-repeat fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.03) 0 1px,transparent 2px 4px);opacity:.45;animation:scan .16s steps(2) infinite}
body:after{content:"";position:fixed;inset:-5%;pointer-events:none;z-index:49;background:linear-gradient(90deg,transparent 48%,rgba(49,230,255,.04) 49%,transparent 50%);animation:drift 1.3s steps(2) infinite}
@keyframes scan{50%{transform:translateY(1px)}}@keyframes drift{20%{transform:translateX(-2%)}21%{transform:translateX(2%)}53%{transform:translateX(-1%)}}
.wrap{width:min(800px,100%);position:relative;z-index:2}.card{position:relative;overflow:hidden;border:1px solid rgba(109,255,152,.22);padding:clamp(28px,6vw,62px);background:rgba(0,5,2,.68);box-shadow:0 0 70px rgba(32,255,113,.08);backdrop-filter:blur(4px);animation:flick 5s infinite}
.card:before,.card:after{content:"";position:absolute;left:-5%;width:110%;height:12px;pointer-events:none;opacity:0}.card:before{top:27%;background:rgba(49,230,255,.16);animation:tear 4s infinite}.card:after{top:68%;background:rgba(255,62,88,.12);animation:tear 5.3s infinite reverse}
@keyframes flick{0%,92%,95%,100%{opacity:1}93%{opacity:.72;filter:contrast(1.6)}94%{transform:translateX(2px)}}@keyframes tear{0%,88%,100%{opacity:0;transform:none}89%{opacity:.65;transform:translateX(18px)}90%{opacity:.2;transform:translateX(-18px)}}
.tag{color:var(--g);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:18px}h1{font-size:clamp(34px,8vw,72px);line-height:.95;margin:0 0 24px;letter-spacing:.06em;text-shadow:2px 0 var(--r),-2px 0 var(--c)}p{line-height:1.8;color:rgba(233,255,240,.72)}
.quote{font-size:clamp(18px,3vw,24px);border-left:2px solid var(--g);padding-left:20px;margin:28px 0}.glitch{animation:glitch 2.8s infinite}@keyframes glitch{0%,88%,100%{transform:none}89%{transform:translate(4px,-1px)}90%{transform:translate(-3px,1px)}}
.signal{font-size:11px;letter-spacing:.12em;color:rgba(109,255,152,.52)}.unstable{color:var(--r);animation:blink .65s steps(1) infinite}@keyframes blink{50%{opacity:.2}}
button,a.btn{display:inline-block;margin-top:18px;border:1px solid var(--g);background:#0008;color:var(--g);padding:14px 20px;font:inherit;text-transform:uppercase;letter-spacing:.1em;text-decoration:none;cursor:pointer}button:hover,a.btn:hover{background:var(--g);color:#001306}
input{width:100%;padding:15px 16px;margin-top:16px;background:#000d;border:1px solid rgba(109,255,152,.35);color:var(--fg);font:inherit;outline:none}.small{font-size:12px;color:#7d8d82;margin-top:18px}.center{text-align:center}.red{color:var(--r)}.green{color:var(--g)}
@media(max-width:560px){body{padding:12px}.card{padding:28px 20px}}

/* ===== MOBILE FIX V4 ===== */
html{
  min-height:100%;
  background:#000;
  -webkit-text-size-adjust:100%;
}
body{
  min-height:100svh;
  min-height:100dvh;
  height:auto;
  overflow-x:hidden;
  overflow-y:auto;
  align-items:start;
  justify-items:center;
  padding:
    max(16px, env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    max(24px, env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));
  background-attachment:scroll;
}
.wrap{
  width:min(800px,100%);
  margin:clamp(18px,5vh,56px) auto;
}
.card{
  width:100%;
}
input,button,a.btn{
  font-size:16px; /* evita zoom automático do iOS */
}
input{
  scroll-margin-top:18vh;
  scroll-margin-bottom:35vh;
}
@media (max-width:560px){
  body{
    display:block;
    min-height:100dvh;
    padding-top:max(14px, env(safe-area-inset-top));
    padding-bottom:max(40px, env(safe-area-inset-bottom));
  }
  .wrap{
    margin:14px auto 40px;
    width:100%;
  }
  .card{
    padding:24px 18px 28px;
    min-height:auto;
    backdrop-filter:blur(2px);
  }
  h1{
    font-size:clamp(34px,13vw,58px);
    word-break:normal;
    overflow-wrap:anywhere;
  }
  .quote{
    font-size:clamp(16px,5vw,20px);
    line-height:1.55;
    margin:20px 0;
    padding-left:14px;
  }
  p{
    line-height:1.6;
  }
  form{
    width:100%;
  }
  input{
    width:100%;
    min-height:52px;
  }
  button,a.btn{
    width:100%;
    text-align:center;
    min-height:50px;
  }
  .signal{
    line-height:1.6;
    overflow-wrap:anywhere;
  }
}
/* Quando o teclado virtual reduz a viewport */
@media (max-height:560px){
  body{
    display:block;
  }
  .wrap{
    margin:8px auto 28px;
  }
  .card{
    padding-top:18px;
    padding-bottom:22px;
  }
  h1{
    font-size:34px;
    margin-bottom:14px;
  }
  .quote{
    margin:14px 0;
    font-size:16px;
  }
}
</style></head><body>
<main class="wrap"><section class="card"><div class="tag">Arquivo #004 // acesso restrito</div><h1 class="glitch">PROVE.</h1><div class="signal">PACOTES PERDIDOS: <span class="unstable" id="loss">17%</span> // CANAL: COMPROMETIDO</div><div class="quote" id="charada"></div>
<form id="form"><input id="resposta" autocomplete="off" placeholder="Digite a resposta..." required><button>Enviar resposta</button></form><div class="small">A charada muda. O arquivo, não.</div></section></main>
<script>
const CHARADAS=[
{texto:`Eu entro sem chave.<br>Vejo sem olhos.<br>Guardo aquilo que ninguém deveria saber.<br><br>Quem sou eu?`,respostas:["phantasma","o phantasma"]},
{texto:`Não sou um Cisne, mas conheço cada pena.<br>Não apareço na fotografia, mas estou em todos os segredos.<br><br>Diga meu nome.`,respostas:["phantasma","o phantasma"]},
{texto:`Quanto mais tentam me encontrar, menos rastros encontram.<br>Eu observo os Cisnes do lugar onde ninguém olha.<br><br>Quem abriu este arquivo antes de você?`,respostas:["phantasma","o phantasma"]}
];
function n(t){return t.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ")}
let i=Number(sessionStorage.getItem("charada_idx"));if(!Number.isInteger(i)||i<0||i>=CHARADAS.length){i=Math.floor(Math.random()*CHARADAS.length);sessionStorage.setItem("charada_idx",i)}const atual=CHARADAS[i];document.getElementById("charada").innerHTML=atual.texto;
document.getElementById("form").onsubmit=e=>{e.preventDefault();if(window.PhantasmaAudio)PhantasmaAudio.play("acesso",.28);const ok=atual.respostas.map(n).includes(n(document.getElementById("resposta").value));sessionStorage.setItem("phantasma_resultado",ok?"ok":"erro");if(window.PhantasmaFX){PhantasmaFX.transitionTo("loading.html","> RESPOSTA CAPTURADA.")}else{location.href="loading.html"}};
setInterval(()=>{loss.textContent=(8+Math.floor(Math.random()*27))+"%";if(Math.random()>.6){document.querySelector(".card").style.transform=`translate(${Math.random()*6-3}px,${Math.random()*3-1.5}px)`;setTimeout(()=>document.querySelector(".card").style.transform="",90)}},800);
</script>
<script>
(function(){
  const input = document.getElementById('resposta');
  if (!input) return;

  function keepInputVisible(){
    setTimeout(() => {
      input.scrollIntoView({behavior:'smooth', block:'center'});
    }, 250);
  }

  input.addEventListener('focus', keepInputVisible);
  input.addEventListener('click', keepInputVisible);

  let lastKeySound=0;
  input.addEventListener('input',()=>{
    const now=performance.now();
    if(now-lastKeySound>42 && window.PhantasmaAudio){
      PhantasmaAudio.play("tecla",.07);
      lastKeySound=now;
    }
  });

  if (window.visualViewport) {
    const adjustForKeyboard = () => {
      document.documentElement.style.setProperty(
        '--vvh',
        window.visualViewport.height + 'px'
      );
      if (document.activeElement === input) keepInputVisible();
    };
    window.visualViewport.addEventListener('resize', adjustForKeyboard);
    window.visualViewport.addEventListener('scroll', adjustForKeyboard);
    adjustForKeyboard();
  }
})();
</script>
<script src="phantasma-fx.js"></script><script src="phantasma-audio.js"></script></body></html>
